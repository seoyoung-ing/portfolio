name: 노션 동기화

on:
  # 수동 실행 — Actions 탭에서 버튼으로 바로 돌릴 수 있습니다
  workflow_dispatch:
  # 매일 한 번 자동 실행 (한국시간 오전 9시)
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 노션 읽어서 data.json 만들기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: node scripts/sync-notion.js

      - name: 바뀐 내용 저장하기
        run: |
          git config user.name  "notion-sync"
          git config user.email "actions@github.com"

          # 이미지가 하나도 없을 수 있으므로 폴더를 미리 만들어 둔다
          mkdir -p images

          git add -A data.json images

          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi

          git commit -m "노션 내용 동기화 $(date +'%Y-%m-%d %H:%M')"

          if ! git push; then
            echo ""
            echo "저장소에 쓰지 못했습니다."
            echo "Settings → Actions → General → Workflow permissions 에서"
            echo "'Read and write permissions' 를 선택하고 저장한 뒤 다시 실행해 주세요."
            exit 1
          fi

          echo "저장을 마쳤습니다."
