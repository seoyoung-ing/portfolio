name: 노션 동기화

on:
  # 수동 실행 — Actions 탭에서 버튼으로 바로 돌릴 수 있습니다
  workflow_dispatch:
  # 매일 한 번 자동 실행 (한국시간 오전 9시)
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 노션 읽어서 data.json 만들기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: node scripts/sync-notion.js

      - name: 바뀐 내용 저장하기
        run: |
          git config user.name  "notion-sync"
          git config user.email "actions@github.com"
          git add data.json images
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "노션 내용 동기화 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
