<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서영 · 프로덕트 포트폴리오</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  /* ================= 토큰 ================= */
  :root{
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    /* 세 역할 모두 Pretendard. 굵기·자간·숫자 기능으로만 구분한다 */
    --serif:var(--sans);
    --mono:var(--sans);
    --max:1180px;
    --ease:cubic-bezier(.2,.7,.3,1);
  }

  [data-theme="light"]{
    --bg:#FFFFFF;
    --surface:#F7F7F6;
    --surface-2:#EFEFED;
    --line:#E2E2DE;
    --line-strong:#C9C9C4;
    --text:#16171A;
    --text-2:#6B6D72;
    --text-3:#9A9C9F;
    --a:#F1F1EF; --on-a:#16171A;
    --b:#E3E3E0; --on-b:#16171A;
    --c:#CFCFCB; --on-c:#16171A;
    --d:#1C1D20; --on-d:#F5F5F3;
    --pattern:rgba(0,0,0,.10);
    --pattern-on-d:rgba(255,255,255,.12);
  }
  [data-theme="dark"]{
    --bg:#0E0F11;
    --surface:#17181B;
    --surface-2:#1F2024;
    --line:#292A2E;
    --line-strong:#41434８;
    --line-strong:#414348;
    --text:#EDEDEB;
    --text-2:#94969B;
    --text-3:#6B6D72;
    --a:#1B1C1F; --on-a:#EDEDEB;
    --b:#232529; --on-b:#EDEDEB;
    --c:#32343A; --on-c:#EDEDEB;
    --d:#E7E7E4; --on-d:#141518;
    --pattern:rgba(255,255,255,.10);
    --pattern-on-d:rgba(0,0,0,.12);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;letter-spacing:-0.011em;
    transition:background .3s var(--ease), color .3s var(--ease);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:1.5px solid var(--text);outline-offset:3px}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 32px}
  /* '모노' 역할 = Pretendard + 고정폭 숫자 + 넓은 자간 + 중간 굵기 */
  .mono,.toggle button,.spec,.sec-head .note,.card .meta,.eyebrow,
  .facts,.tag,.chip,.back,.step .n,.result .v,.cv-row .when,.skills .k,
  .chapter .kicker,.more h5,.foot{
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1,"case" 1;
  }
  .mono{letter-spacing:.01em;font-weight:500}

  /* ================= 유틸 바 ================= */
  .util{border-bottom:1px solid var(--line)}
  .util .wrap{height:54px;display:flex;align-items:center;justify-content:space-between}
  .mark{font-weight:700;font-size:15.5px;letter-spacing:-0.025em}
  .toggle{
    display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  }
  .toggle button{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;
    padding:6px 11px;color:var(--text-3);transition:background .2s,color .2s
  }
  .toggle button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

  /* ================= 아이덴티티 ================= */
  .identity{padding:56px 0 40px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
  .name{
    font-weight:800;font-size:46px;line-height:1.12;
    letter-spacing:-0.05em;margin:10px 0 0
  }
  .spec{
    display:flex;flex-wrap:wrap;gap:0 26px;margin-top:16px;
    font-family:var(--mono);font-size:12px;color:var(--text-2)
  }
  .spec span{position:relative;padding-left:14px}
  .spec span::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:1px;background:var(--line-strong)}
  .bio{font-size:15.5px;line-height:1.78;color:var(--text-2);margin:22px 0 0;max-width:600px;word-break:keep-all}
  .bio b{color:var(--text);font-weight:600}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:22px;margin-top:26px}
  .links{display:flex;flex-wrap:wrap;gap:20px}
  .links a{font-size:13.5px;color:var(--text-2);border-bottom:1px solid var(--line-strong);padding-bottom:2px;transition:color .2s,border-color .2s}
  .links a:hover{color:var(--text);border-color:var(--text)}
  .cta{
    border:1px solid var(--text);color:var(--text);font-size:13.5px;font-weight:600;
    padding:10px 20px;border-radius:2px;transition:background .2s,color .2s
  }
  .cta:hover{background:var(--text);color:var(--bg)}

  /* ================= 탭 ================= */
  .tabs{
    display:flex;gap:30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    position:sticky;top:0;background:var(--bg);z-index:20
  }
  .tab{
    padding:16px 0;font-size:14.5px;font-weight:600;color:var(--text-3);
    border-bottom:1px solid transparent;margin-bottom:-1px;transition:color .2s
  }
  .tab:hover{color:var(--text-2)}
  .tab[aria-selected="true"]{color:var(--text);border-color:var(--text)}

  /* ================= 섹션 ================= */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:52px 0 22px}
  .sec-head h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-0.035em}
  .sec-head .note{font-family:var(--mono);font-size:11.5px;color:var(--text-3);letter-spacing:.02em}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:44px 30px}
  .card{text-align:left;width:100%;display:block}
  .thumb{
    position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--line);
    display:grid;place-items:center;padding:22px;border-radius:2px;
    transition:border-color .25s var(--ease)
  }
  .card:hover .thumb{border-color:var(--line-strong)}
  .thumb .pat{position:absolute;inset:0;opacity:.9}
  .thumb-text{
    position:relative;z-index:2;font-weight:700;
    font-size:25px;line-height:1.36;text-align:center;letter-spacing:-0.042em;word-break:keep-all
  }
  .card h3{
    font-size:15px;font-weight:600;line-height:1.5;margin:16px 0 8px;word-break:keep-all;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    transition:opacity .2s
  }
  .card:hover h3{opacity:.62}
  .card .meta{font-family:var(--mono);font-size:12px;color:var(--text-2);line-height:1.6}
  .card .meta em{font-style:normal;color:var(--text-3)}

  /* 실험 — 정사각 소형 카드 */
  .grid-sm{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 24px}
  .thumb-sq{aspect-ratio:1/1;padding:18px}
  .thumb-sq .thumb-text{font-size:18px;line-height:1.4}

  /* ================= 이력 ================= */
  .cv{border-top:1px solid var(--line)}
  .cv-row{
    display:grid;grid-template-columns:148px 1fr;gap:32px;
    padding:30px 0;border-bottom:1px solid var(--line);text-align:left
  }
  .cv-row .when{font-size:12.5px;color:var(--text-3);line-height:1.7;padding-top:3px}
  .cv-row .when b{display:block;color:var(--text-2);font-weight:500}
  .cv-role{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 12px}
  .cv-role h3{font-size:18px;font-weight:700;margin:0;letter-spacing:-0.035em;line-height:1.45}
  .cv-role .at{font-size:13.5px;color:var(--text-2)}
  .cv-row p{margin:10px 0 0;font-size:14.5px;color:var(--text-2);line-height:1.75;word-break:keep-all}
  .cv-row ul{margin:16px 0 0;padding:0;list-style:none}
  .cv-row li{
    font-size:14px;line-height:1.7;color:var(--text-2);padding:0 0 8px 20px;
    position:relative;word-break:keep-all
  }
  .cv-row li::before{content:"";position:absolute;left:0;top:.95em;width:8px;height:1px;background:var(--line-strong)}
  .cv-row li b{color:var(--text);font-weight:600}
  .skills{display:grid;grid-template-columns:148px 1fr;gap:32px;padding:30px 0;border-bottom:1px solid var(--line)}
  .skills .k{font-size:12.5px;color:var(--text-3);padding-top:3px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12.5px;color:var(--text-2);border:1px solid var(--line);padding:6px 11px;border-radius:2px}
  .chip.on{border-color:var(--text);color:var(--text);font-weight:600}

  /* ================= 상세 ================= */
  .detail{
    position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;
    opacity:0;pointer-events:none;transform:translateY(10px);
    transition:opacity .28s var(--ease), transform .28s var(--ease)
  }
  .detail.open{opacity:1;pointer-events:auto;transform:none}
  .dbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:6}
  .dbar .wrap{height:54px;display:flex;align-items:center;justify-content:space-between}
  .back{font-family:var(--mono);font-size:12px;color:var(--text-2);letter-spacing:.02em;transition:color .2s}
  .back:hover{color:var(--text)}

  .dhead{padding:52px 0 0;max-width:820px}
  .dhead h1{font-size:34px;font-weight:800;letter-spacing:-0.05em;line-height:1.3;margin:12px 0 0;word-break:keep-all}
  .dhead .lede{font-size:16px;line-height:1.85;color:var(--text-2);margin:20px 0 0;word-break:keep-all}
  .facts{display:flex;flex-wrap:wrap;gap:0 34px;margin:28px 0 0;font-family:var(--mono);font-size:12px}
  .facts div{border-top:1px solid var(--line);padding-top:9px;min-width:110px}
  .facts .k{color:var(--text-3);display:block;margin-bottom:4px;font-size:11px;letter-spacing:.06em}
  .facts .v{color:var(--text)}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:24px}
  .tag{font-family:var(--mono);font-size:11.5px;color:var(--text-2);border:1px solid var(--line);padding:5px 9px;border-radius:2px}

  .hero{
    aspect-ratio:21/8;margin:38px 0 0;border:1px solid var(--line);border-radius:2px;
    display:grid;place-items:center;position:relative;overflow:hidden;padding:26px
  }
  .hero .pat{position:absolute;inset:0}
  .hero-text{position:relative;z-index:2;font-weight:700;font-size:38px;line-height:1.28;text-align:center;letter-spacing:-0.048em;word-break:keep-all}

  /* 시그니처: 단계 레일 */
  .rail-steps{
    position:sticky;top:54px;background:var(--bg);z-index:5;
    border-bottom:1px solid var(--line);padding:18px 0 14px;margin-top:38px
  }
  .steps{display:flex;gap:0}
  .step{flex:1;text-align:left;position:relative;padding-right:16px}
  .step .line{height:1px;background:var(--line);position:relative;margin-bottom:11px}
  .step .line i{position:absolute;left:0;top:0;height:1px;width:0;background:var(--text);transition:width .45s var(--ease)}
  .step.done .line i{width:100%}
  .step .n{font-family:var(--mono);font-size:11px;color:var(--text-3);display:block;margin-bottom:3px;transition:color .2s}
  .step .l{font-size:13px;font-weight:600;color:var(--text-3);transition:color .2s;word-break:keep-all}
  .step:hover .l{color:var(--text-2)}
  .step.active .n,.step.active .l{color:var(--text)}

  .body{max-width:720px;padding-bottom:20px}
  .chapter{padding:46px 0 0}
  .chapter .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase}
  .chapter h4{font-size:22px;font-weight:700;margin:12px 0 16px;letter-spacing:-0.04em;line-height:1.42;word-break:keep-all}
  .chapter p{font-size:15.5px;line-height:1.92;color:var(--text-2);margin:0 0 14px;word-break:keep-all}
  .chapter ul{margin:18px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
  .chapter li{
    font-size:14.5px;line-height:1.7;color:var(--text-2);padding:11px 0 11px 22px;
    border-bottom:1px solid var(--line);position:relative;word-break:keep-all
  }
  .chapter li::before{content:"";position:absolute;left:0;top:1.05em;width:9px;height:1px;background:var(--line-strong)}

  .results{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--text);margin-top:20px}
  .result{padding:20px 20px 22px 0;border-bottom:1px solid var(--line)}
  .result .v{font-size:28px;font-weight:700;letter-spacing:-0.045em}
  .result .l{font-size:12.5px;color:var(--text-2);margin-top:8px;line-height:1.6;word-break:keep-all}

  .more{border-top:1px solid var(--line);margin-top:64px;padding:38px 0 90px}
  .more h5{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--text-3);margin:0 0 22px;text-transform:uppercase}
  .more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}

  .foot{border-top:1px solid var(--line);margin-top:80px;padding:28px 0 64px;
    color:var(--text-3);font-family:var(--mono);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media (max-width:980px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .grid-sm{grid-template-columns:repeat(3,1fr)}
    .more-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:680px){
    .wrap{padding:0 18px}
    .identity{grid-template-columns:1fr;gap:22px;padding:36px 0 30px}
    .name{font-size:34px}
    .grid{grid-template-columns:1fr;gap:34px}
    .grid-sm{grid-template-columns:repeat(2,1fr)}
    .more-grid{grid-template-columns:1fr}
    .thumb-text{font-size:21px}
    .hero{aspect-ratio:4/3}
    .hero-text{font-size:26px}
    .dhead h1{font-size:27px}
    .results{grid-template-columns:1fr}
    .cv-row,.skills{grid-template-columns:1fr;gap:10px}
    .steps{overflow-x:auto}
    .step{min-width:100px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ============ 유틸 ============ -->
<div class="util">
  <div class="wrap">
    <span class="mark" id="p-mark"></span>
    <div class="toggle" role="group" aria-label="테마 선택">
      <button data-theme-set="light" aria-pressed="true">LIGHT</button>
      <button data-theme-set="dark" aria-pressed="false">DARK</button>
    </div>
  </div>
</div>

<!-- ============ 목록 ============ -->
<div id="list">
  <div class="wrap">
    <header class="identity">
      <div>
        <div class="eyebrow" id="p-eyebrow"></div>
        <h1 class="name" id="p-name"></h1>
        <div class="spec" id="p-spec"></div>
        <p class="bio" id="p-bio"></p>
        <div class="row">
          <div class="links" id="p-links"></div>
          <button class="cta" id="p-cta"></button>
        </div>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="home">홈</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="resume">이력</button>
    </nav>

    <div id="view-home">
      <section>
        <div class="sec-head"><h2>프로젝트</h2><span class="note" id="count-project"></span></div>
        <div class="grid" id="grid-project"></div>
      </section>
    </div>

    <div id="view-resume" style="display:none">
      <div class="sec-head"><h2>경력</h2><span class="note" id="p-careernote"></span></div>
      <div class="cv" id="cv-career"></div>

      <div class="sec-head"><h2>역량</h2><span class="note">굵게 표시한 항목이 주력</span></div>
      <div class="cv" id="cv-skills"></div>

      <div class="sec-head"><h2>학력 · 그 외</h2><span class="note"></span></div>
      <div class="cv" id="cv-etc"></div>
    </div>

    <div class="foot">
      <span>© 2026 서영</span>
      <span>목업 · 데이터는 노션에서 불러올 예정</span>
    </div>
  </div>
</div>

<!-- ============ 상세 ============ -->
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="프로젝트 상세">
  <div class="dbar">
    <div class="wrap">
      <button class="back" id="back">← 목록으로</button>
      <span class="back" id="d-index"></span>
    </div>
  </div>
  <div class="wrap">
    <div class="dhead">
      <div class="eyebrow" id="d-kicker"></div>
      <h1 id="d-title"></h1>
      <p class="lede" id="d-summary"></p>
      <div class="facts" id="d-facts"></div>
      <div class="tags" id="d-tags"></div>
    </div>

    <div class="hero" id="d-hero"><span class="pat" id="d-heropat"></span><span class="hero-text" id="d-herotext"></span></div>

    <div class="rail-steps"><div class="steps" id="d-steps"></div></div>

    <div class="body" id="d-chapters"></div>

    <div class="more">
      <h5>다른 프로젝트</h5>
      <div class="more-grid" id="d-more"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   노션 DB 속성과 1:1 매핑되는 스키마
   ========================================================= */
const PAT = {
  grid:  c => `background-image:linear-gradient(${c} 1px,transparent 1px),linear-gradient(90deg,${c} 1px,transparent 1px);background-size:26px 26px`,
  dots:  c => `background-image:radial-gradient(${c} 1px,transparent 1px);background-size:14px 14px`,
  rules: c => `background-image:repeating-linear-gradient(0deg,${c} 0 1px,transparent 1px 9px)`,
  diag:  c => `background-image:repeating-linear-gradient(45deg,${c} 0 1px,transparent 1px 12px)`,
  arcs:  c => `background-image:repeating-radial-gradient(circle at 12% 108%,transparent 0 34px,${c} 34px 35px)`,
  plain: () => ``
};
const toneVars = t => `background:var(--${t});color:var(--on-${t})`;
const patStyle = (p, t) => PAT[p](t === 'd' ? 'var(--pattern-on-d)' : 'var(--pattern)');

/* ═══════════════════════════════════════════════════════════
   ▼▼▼  여기부터 수정하세요  ▼▼▼

   이 아래 다섯 개 목록만 고치면 사이트 전체가 바뀝니다.
     PROFILE  상단 헤더 (이름·소개·링크)
     DATA     프로젝트 카드와 상세 화면
     CAREER   이력 탭 - 경력
     SKILLS   이력 탭 - 역량
     ETC      이력 탭 - 학력·그 외

   자주 쓰는 값
     tone  썸네일 배경 명도 → 'a' 밝은회색 / 'b' 중간 / 'c' 짙은회색 / 'd' 먹
     pat   썸네일 패턴     → 'grid' / 'dots' / 'rules' / 'diag' / 'arcs' / 'plain'
     \n    썸네일 문구의 줄바꿈 (thumbTitle에서 사용)
     <b>   굵게 강조 (bio, CAREER의 points에서 사용 가능)

   주의: 따옴표와 쉼표를 지우지 마세요. 글자만 바꾸면 됩니다.
   ═══════════════════════════════════════════════════════════ */

const PROFILE = {
  mark:       '기술의 가장 인간적인 형태를 만드는 PM, 최서영입니다',   // 좌측 상단 작은 표기
  eyebrow:    'Product Manager · Seoul', // 이름 위 한 줄
  name:       '최서영',
  spec:       ['3년차', 'NH투자증권 나무증권', '프로젝트 6', '2024 – 현재'],

  {k:'설계', items:[['정보구조',1],['인터랙티브 프로토타입',1],['디자인 시스템',0],['UX 라이팅',0]]},

/* ================= 렌더 ================= */
/* ═══════════════════════════════════════════════════════════
   ▲▲▲  여기까지 수정하세요  ▲▲▲
   아래는 화면을 그리는 코드입니다. 손대지 않아도 됩니다.
   ═══════════════════════════════════════════════════════════ */

const $ = s => document.querySelector(s);

document.title = PROFILE.name + ' · 포트폴리오';
$('#p-mark').textContent       = PROFILE.mark;
$('#p-eyebrow').textContent    = PROFILE.eyebrow;
$('#p-name').textContent       = PROFILE.name;
$('#p-spec').innerHTML         = PROFILE.spec.map(v => `<span>${v}</span>`).join('');
$('#p-bio').innerHTML          = PROFILE.bio;
$('#p-links').innerHTML        = PROFILE.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`).join('');
$('#p-cta').textContent        = PROFILE.cta;
$('#p-careernote').textContent = PROFILE.careerNote;
const projects = DATA.filter(d => d.type === 'project');
$('#count-project').textContent = projects.length + ' PROJECTS';

const thumbHTML = (p, small) => `
  <div class="thumb ${small ? 'thumb-sq' : ''}" style="${toneVars(p.tone)}">
    <span class="pat" style="${patStyle(p.pat, p.tone)}"></span>
    <span class="thumb-text">${p.thumbTitle.replace(/\n/g,'<br>')}</span>
  </div>`;

$('#grid-project').innerHTML = projects.map(p => `
  <button class="card" data-id="${p.id}">
    ${thumbHTML(p, false)}
    <h3>${p.title}</h3>
    <div class="meta">${p.metric}<br><em>${p.badge} · ${p.year}</em></div>
  </button>`).join('');

const cvRow = c => `
  <div class="cv-row">
    <div class="when">${c.from}${c.to ? ' — ' + c.to : ''}<b>${c.span}</b></div>
    <div>
      <div class="cv-role"><h3>${c.role}</h3><span class="at">${c.at}</span></div>
      ${c.desc ? `<p>${c.desc}</p>` : ''}
      ${c.points && c.points.length ? `<ul>${c.points.map(t => `<li>${t}</li>`).join('')}</ul>` : ''}
    </div>
  </div>`;

$('#cv-career').innerHTML = CAREER.map(cvRow).join('');
$('#cv-etc').innerHTML = ETC.map(cvRow).join('');
$('#cv-skills').innerHTML = SKILLS.map(g => `
  <div class="skills">
    <div class="k">${g.k}</div>
    <div class="chips">${g.items.map(([n,on]) => `<span class="chip${on ? ' on' : ''}">${n}</span>`).join('')}</div>
  </div>`).join('');

/* ================= 테마 ================= */
document.querySelectorAll('[data-theme-set]').forEach(b => {
  b.addEventListener('click', () => {
    const v = b.dataset.themeSet;
    document.documentElement.setAttribute('data-theme', v);
    document.querySelectorAll('[data-theme-set]').forEach(x =>
      x.setAttribute('aria-pressed', String(x.dataset.themeSet === v)));
  });
});

/* ================= 탭 ================= */
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected','false'));
    t.setAttribute('aria-selected','true');
    const v = t.dataset.tab;
    $('#view-home').style.display    = v === 'home' ? '' : 'none';
    $('#view-resume').style.display  = v === 'resume' ? '' : 'none';
  });
});

/* ================= 상세 ================= */
const detail = $('#detail');
let current = null;

function openDetail(id){
  const p = DATA.find(d => d.id === id);
  if(!p) return;
  current = p;

  $('#d-kicker').textContent = 'PROJECT · ' + p.year;
  $('#d-title').textContent = p.title;
  $('#d-summary').textContent = p.summary;
  $('#d-index').textContent = p.metric;
  $('#d-facts').innerHTML = [
    ['역할', p.role], ['팀', p.team], ['기간', p.period], ['소요', p.badge]
  ].map(([k,v]) => `<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join('');
  $('#d-tags').innerHTML = p.tags.map(t => `<span class="tag">${t}</span>`).join('');

  const hero = $('#d-hero');
  hero.setAttribute('style', toneVars(p.tone));
  $('#d-heropat').setAttribute('style', patStyle(p.pat, p.tone));
  $('#d-herotext').innerHTML = p.thumbTitle.replace(/\n/g,'<br>');

  $('#d-steps').innerHTML = p.chapters.map((c,i) => `
    <button class="step" data-jump="${i}">
      <span class="line"><i></i></span>
      <span class="n">${c.n}</span>
      <span class="l">${c.label}</span>
    </button>`).join('');

  $('#d-chapters').innerHTML = p.chapters.map((c,i) => `
    <section class="chapter" id="ch-${i}">
      <div class="kicker">${c.n} — ${c.label}</div>
      <h4>${c.h}</h4>
      ${c.p.map(t => `<p>${t}</p>`).join('')}
      ${c.ul ? `<ul>${c.ul.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}
    </section>`).join('') + `
    <section class="chapter">
      <div class="kicker">결과</div>
      <h4>숫자로 남은 것</h4>
      <div class="results">
        ${p.results.map(r => `<div class="result"><div class="v">${r.v}</div><div class="l">${r.l}</div></div>`).join('')}
      </div>
    </section>`;

  $('#d-more').innerHTML = DATA.filter(d => d.id !== p.id).slice(0,3).map(o => `
    <button class="card" data-id="${o.id}">
      ${thumbHTML(o, true)}
      <h3>${o.title}</h3>
      <div class="meta"><em>${o.metric}</em></div>
    </button>`).join('');

  detail.classList.add('open');
  detail.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(updateSteps);
}

function closeDetail(){
  detail.classList.remove('open');
  document.body.style.overflow = '';
  current = null;
}

function updateSteps(){
  if(!current) return;
  const steps = [...document.querySelectorAll('#d-steps .step')];
  let active = 0;
  current.chapters.forEach((c,i) => {
    const el = document.getElementById('ch-' + i);
    if(el && el.getBoundingClientRect().top < window.innerHeight * 0.5) active = i;
  });
  steps.forEach((s,i) => {
    s.classList.toggle('done', i <= active);
    s.classList.toggle('active', i === active);
  });
}
detail.addEventListener('scroll', () => requestAnimationFrame(updateSteps));

document.addEventListener('click', e => {
  if(e.target.closest('#back')) return closeDetail();
  const jump = e.target.closest('[data-jump]');
  if(jump){
    document.getElementById('ch-' + jump.dataset.jump)?.scrollIntoView({behavior:'smooth', block:'start'});
    return;
  }
  const card = e.target.closest('[data-id]');
  if(card) openDetail(card.dataset.id);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && current) closeDetail(); });
</script>
